[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ngsutils"
version = "0.2.0"
description = "Utilities for NGS processing"
authors = [
  { name = "yhamaguc" }
]
dependencies = [
  "docopt",
  "pandas",
  "polars",
  "sqlalchemy",
  "pysqlite3"
]

[project.scripts]
ngsutils = "ngsutils.cli:main"

[tool.setuptools.packages.find]
# NOTE: without include/namespaces, the pyproject form of packages.find defaults
#   to namespaces = true and so discovers every directory here as a package --
#   bin, tests, and build itself. Discovering build made each build copy the tree
#   into build/lib, which then contained build/lib/build/lib/... ; the 0.2.0
#   install shipped 9 levels of that, plus bin/ and tests/ into site-packages,
#   plus scripts that had been deleted from the repo.
where = ["."]
include = ["ngsutils*"]
namespaces = false

[tool.setuptools.package-data]
ngsutils = ["data/*.pkl"]

[tool.setuptools]
script-files = [
  "bin/align_star.sh",
  "bin/build_hisat2.sh",
  "bin/build_hisat2_wo_gtf.sh",
  "bin/build_kallisto.sh",
  "bin/build_rsem_ebseq.sh",
  "bin/build_salmon.sh",
  "bin/build_star.sh",
  "bin/conv_sjouttab2bed.py",
  "bin/conv_tximport.R",
  "bin/de_deseq2.R",
  "bin/download_gencode_hs.sh",
  "bin/gtf2bed.sh",
  "bin/merge_sjouttab2sjdb.py",
  "bin/pbrun_fq2bam.sh",
  "bin/quant_salmon.sh",
  "bin/trim_fastp.sh"
]
