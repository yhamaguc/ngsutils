[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ngsutils"
version = "0.2.0"
description = "Utilities for NGS processing"
authors = [
  { name = "yhamaguc" }
]
dependencies = [
  "docopt",
  "pandas",
  "polars",
  "sqlalchemy",
  "pysqlite3"
]

[project.scripts]
ngsutils = "ngsutils.cli:main"

[tool.setuptools.packages.find]
# NOTE: without include/namespaces, the pyproject form of packages.find defaults
#   to namespaces = true and so discovers every directory here as a package --
#   bin, tests, and build itself. Discovering build made each build copy the tree
#   into build/lib, which then contained build/lib/build/lib/... ; the 0.2.0
#   install shipped 9 levels of that, plus bin/ and tests/ into site-packages,
#   plus scripts that had been deleted from the repo.
where = ["."]
include = ["ngsutils*"]
namespaces = false

[tool.setuptools.package-data]
ngsutils = ["data/*.pkl"]
